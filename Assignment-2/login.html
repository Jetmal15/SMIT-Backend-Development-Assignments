<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Login Form</title>
</head>

<body>

    <!-- Back Button -->
    <!-- <a href="javascript:history.back()">
        <button type="button">←</button>
    </a> -->
    <a href="index.html" style="background-color: chartreuse; color: red;">←</a>

    <br><br><br>

    <!-- SMIT Logo -->
    <center>

        <img src="smit-logo.png" alt="SMIT Logo" width="250">
        <br><br><br>

        <br><br><br><br><br>

        <h1>STUDENT LOGIN FORM</h1>

        <br>

        <!-- Login Form -->
        <form>

            <table cellpadding="10" cellspacing="5">

                <!-- Email -->
                <tr>
                    <td>
                        <label for="email">Email</label>
                    </td>

                    <td>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter Email"
                            required
                        >
                    </td>
                </tr>

                <!-- Password -->
                <tr>
                    <td>
                        <label for="password">Password</label>
                    </td>

                    <td>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter Password"
                            required
                        >
                    </td>
                </tr>

                <!-- Buttons -->
                <tr>
                    <td></td>

                    <td>
                        <input type="submit" value="Submit">
                        <input type="reset" value="Reset">
                    </td>
                </tr>

            </table>

        </form>

    </center>

</body>
</html>
